name: Build Green Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GreenPlayer-v1.2.0-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.0
        name: "Green Player v1.2.0 (Frosted Arctic Emerald & Custom FFmpeg Codecs)"
        body: |
          ## 🟢 Green Player v1.2.0 - Frosted Arctic Emerald & Advanced Codec Suite
          
          ### 🚀 Major Improvements & Fixes in v1.2.0:
          * ❄️ **Frosted Arctic Emerald Glassmorphism (Theme 2)**:
            * High-quality smoky acrylic glass cards with subtle luminous emerald borders.
            * Redesigned folder cards with glowing vector folder art and count badges (`1`, `2`, `5`, `13`, `99+`).
          * 🎬 **4K HEVC 10-bit & Dolby Vision Profile 8.1 Playback**:
            * Automatic fallback to 10-bit HDR10 color base layer (`BL+RPU`) on devices without proprietary Dolby Vision hardware.
            * Fixes black screen and codec initialization errors on heavy WEBRip / DSNP movies.
          * 🔊 **Custom FFmpeg Codecs (`libffmpeg.so`) & 6-Channel Audio**:
            * Bundled native FFmpeg libraries for `arm64-v8a`, `armeabi-v7a`, `x86`, and `x86_64`.
            * Software downmixing for 6-Channel (5.1 Surround) HE-AAC, AC3, and E-AC3 Dolby Atmos to ensure crisp dialogue audio on stereo device speakers and headphones.
          * 🔙 **Smart Back Navigation**:
            * Pressing Back inside a folder now smoothly returns to the Folder list instead of exiting the app.
            * Pressing Back on any tab (Music, Transfer, Me) returns to the Local Videos tab.
            * Double-tap back required on root screen to prevent accidental app exits.
          * 🧹 **Junk / System Video Cleaner**:
            * Automatic filter excluding files under 200 KB or under 3 seconds duration (purges 00:00 development cache/dummy files).
            * Ignores hidden folders (`.`, `/Android/data/`, `/cache/`).
          * 💬 **External Subtitle File Loader**:
            * Easily browse and attach external `.srt`, `.vtt`, `.sub`, and `.ass` subtitles directly from your device storage.
          * ⚙️ **Direct Toolbar Settings Gear Icon**:
            * One-tap access to Settings from the top bar.
          * 🎛️ **View Mode & Grid Toggle**:
            * Switch seamlessly between Folders and All Files view.
            * 2-column Grid mode for high-density folder and video browsing with live selection feedback.
          * ⏱️ **Floating Play Button Resume**:
            * Bottom right play button now seeks directly to the exact paused timestamp (`Resumed from XX:XX`).
          * 📐 **Screen Aspect Ratio Cycling**:
            * Toggle between Fit to Screen, Zoom / Crop, Stretch to Fill, and 100% Original.
          
          Download **app-debug.apk** below to install!
        files: app/build/outputs/apk/debug/app-debug.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
