name: Build Green Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GreenPlayer-v1.1.0-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: "Green Player v1.1.0 (Advanced Pro Release)"
        body: |
          ## 🟢 Green Player v1.1.0 - Full MX Player Clone Suite
          
          ### 📱 New Features & Screens:
          * 📁 **Folder Browser with Red Count Badges**: Shows video counts (1, 2, 5, 13, 99+) just like MX Player.
          * ⚡ **6 Quick Tools Bar**: Music, File Transfer, Status Saver, My Playlists, Cleaner, Privacy.
          * 🎛️ **View Mode & Sort Dialog**: All folders, Files, Folders / List, Grid / 10 sort criteria (Title, Date, Played time, Status, Length, Size, Resolution, Path, Frame rate, Type).
          * 🧭 **4-Tab Navigation**: Local, Music, Transfer, Me.
          * 🎵 **Music Player Suite**: Sub-tabs (Tracks, Playlists, Albums, Artists, Folders), Search Songs, Shuffle All.
          * 📡 **Transfer Screen**: High-speed P2P send/receive + Web/PC browser download server.
          * 👤 **Me Profile Hub**: 8-tool grid (File Transfer, Private Folder, Video Playlists, Media Manager, Local Network, Music Player, Cloud Drive, Recycle Bin).
          * 🎨 **App Theme Chooser**: Adaptive, Light Theme, Dark Theme + 30-color classic theme palette + Zodiac themes.
          * 🪟 **Custom Pop-up Play**: Previous/Next vs Fast Forward/Rewind toggle.
          * ⚙️ **Comprehensive Settings Hierarchy**:
            * **List**: Last media in folder, scroll to last played, thumbnail selection, floating button, "NEW" badge periods.
            * **Player**: Resume prompt behavior, remember selections, fast seeking, preview while seeking.
            * **Decoder**: HW+ video/audio decoders, SW audio, Custom Codec browser.
            * **Audio**: Audio player background mode, 200% volume boost, audio delay sync, equalizer.
            * **Subtitle**: Global character encoding selector (UTF-8, UTF-16, Cyrillic, Greek, Hebrew, Windows-1252, Shift_JIS, etc.), text sizing, colors.
            * **General**: Localization (English, Sinhala, Spanish, etc.), cache cleaner, history reset.
          
          Download **app-debug.apk** below to install!
        files: app/build/outputs/apk/debug/app-debug.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
