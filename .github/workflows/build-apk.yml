name: Build Green Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GreenPlayer-v1.0.0-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Green Player v1.0.0 Release"
        body: |
          ## 🟢 Green Player v1.0.0 (Play Store Ready)
          
          ### 📱 Features:
          * 🖐️ MX-Style Gestures: Volume, Brightness, Scrubbing Seek HUDs
          * ⏩ Double-Tap: -10s Rewind, +10s Forward, Play/Pause
          * 📐 Aspect Ratio: Fit, Zoom/Crop, Stretch, 100% Original
          * ⚡ Playback Speed: 0.25x – 4.0x
          * 🎧 Multi-Audio & Subtitles (SRT, SSA, ASS, VTT)
          * 🔒 Kids Lock & Picture-in-Picture (PiP)
          * 🎬 Videos, Folders, and Music Scanner
          
          Download the **app-debug.apk** below to install on your phone!
        files: app/build/outputs/apk/debug/app-debug.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
